services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: digital_wallet
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d digital_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/digital_wallet
      LOCAL_DATABASE_URL: postgresql://wallet:wallet@db:5432/digital_wallet
      JWT_SECRET: dev-only-secret-change-me
      JWT_EXPIRES_IN: 15m
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
